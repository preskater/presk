networks:
  postgres-network:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: preskater
      POSTGRES_PASSWORD: preskater
      POSTGRES_DB: preskater
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "preskater"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
